name: Release Build

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Create GitHub pre-release'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Gradle Build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      build_timestamp: ${{ steps.release_build_step.outputs.build_timestamp }}
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_HARDLINK: "true"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "2G"
      NATIVE_TARGET: "arm64-v8a"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: recursive
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Set up Python for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Point Chaquopy at that Python
        run: echo "CHAQUOPY_BUILD_PYTHON=$(which python3.11 || which python)" >> $GITHUB_ENV
      - name: Set up Ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: android-ndk
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Set up Android SDK Tools
        uses: android-actions/setup-android@v4
        with:
          packages: "build-tools;36.0.0 ndk;27.2.12479018 platforms;android-37.0"
      - name: Install Native Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes nasm
      - name: Configure SpaceGram & SDK
        env:
          SECRET_APP_ID: ${{ secrets.APP_ID }}
          SECRET_APP_HASH: ${{ secrets.APP_HASH }}
        run: |
          app_id="${SECRET_APP_ID:-6}"
          app_hash="${SECRET_APP_HASH:-eb06d4abfb49dc3eeb1aeb98ae0f581e}"
          printf "sdk.dir=%s\nTELEGRAM_APP_ID=%s\nTELEGRAM_APP_HASH=%s\n" "$ANDROID_HOME" "$app_id" "$app_hash" > local.properties

          find . -maxdepth 3 -name "build.gradle*" -exec sed -i 's|com\.exteraless\.app|com.spacegram.messenger|g' {} +
          test -f TMessagesProj/google-services.json && sed -i 's|com\.exteraless\.app|com.spacegram.messenger|g' TMessagesProj/google-services.json || true
          find TMessagesProj/src/main/res* -name "*.xml" -exec sed -i 's|exteraless|SpaceGram|g; s|Exteraless|SpaceGram|g; s|@SpaceGram|@SpaceGram_Client|g' {} +
          find TMessagesProj/src/main/java -type f \( -name "*.java" -o -name "*.kt" \) -exec sed -i 's|https://t\.me/exteraless|https://t.me|g; s|@exteraless|@SpaceGram_Client|g; s|exteraless/exteraless|rowwwex/SpaceGram|g' {} +

      - name: Modify Gradle JVM Args
        run: |
          MEMORY_KB=$(awk '/MemTotal/ {print $2}' /proc/meminfo)
          MEMORY_GB=$((MEMORY_KB / 1024 / 1024))
          if [ $MEMORY_GB -ge 12 ]; then
            sed -i '/^org\.gradle\.jvmargs=/d' gradle.properties
            echo "org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=2G -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8" >> gradle.properties
          fi
      - name: Restore signing key
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
        run: |
          if [ -n "$RELEASE_KEYSTORE" ]; then
            echo "$RELEASE_KEYSTORE" | base64 -d > TMessagesProj/release.keystore
          fi
      - name: Release Build
        id: release_build_step
        env:
          COMMIT_ID: ${{ github.event.head_commit.id || github.sha }}
        run: |
          export BUILD_TIMESTAMP=$(date +%s)
          echo "build_timestamp=$BUILD_TIMESTAMP" >> "$GITHUB_OUTPUT"
          ./gradlew TMessagesProj:assembleRelease
      - name: Upload arm64-v8a Artifact
        uses: actions/upload-artifact@v7
        with:
          name: SpaceGram-v0.1
          path: |
            TMessagesProj/build/outputs/apk/release/*.apk
      - name: Publish GitHub pre-release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT=$(echo "$GITHUB_SHA" | cut -c1-7)
          TAG="ci-$SHORT"
          gh release create "$TAG" TMessagesProj/build/outputs/apk/release/*.apk \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "SpaceGram CI $SHORT" --notes "SpaceGram build $SHORT"
