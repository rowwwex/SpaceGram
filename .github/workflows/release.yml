name: Release Build

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish GitHub Release'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Gradle Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Python for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Point Chaquopy at that Python
        run: |
          PYTHON_PATH=$(which python3)
          echo "chaquopy.python=$PYTHON_PATH" >> gradle.properties

      - name: Cache Permanent APK Signing Key
        uses: actions/cache@v4
        with:
          path: TMessagesProj/release.keystore
          key: spacegram-signing-key-v1

      - name: Set up Ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ github.job }}-ccache
          max-size: 2G

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK Tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Native Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake yasm nasm

      - name: Apply SpaceGram v0.3 Themes & Fonts Patch
        env:
          SECRET_APP_ID: ${{ secrets.APP_ID }}
          SECRET_APP_HASH: ${{ secrets.APP_HASH }}
        run: |
          app_id="${SECRET_APP_ID:-6}"
          app_hash="${SECRET_APP_HASH:-eb06d4abfb49dc3eeb1aeb98ae0f581e}"
          printf "sdk.dir=%s\nTELEGRAM_APP_ID=%s\nTELEGRAM_APP_HASH=%s\n" "$ANDROID_HOME" "$app_id" "$app_hash" > local.properties

          find . -maxdepth 4 \( -name "build.gradle*" -o -name "*.kt" -o -name "*.properties" -o -name "google-services.json" \) -exec sed -i 's|com\.exteraless\.app|com.spacegram.messenger|g' {} +
          find TMessagesProj/src/main/res* -name "strings*.xml" -exec sed -i -E 's|>([^<]*)[Ee]xteraless([^<]*)<|>\1SpaceGram\2<|g; s|>([^<]*)[Ee]xteraless([^<]*)<|>\1SpaceGram\2<|g; s|@SpaceGram([^_])|@SpaceGram_Client\1|g; s|@SpaceGram<|@SpaceGram_Client<|g' {} +

          mkdir -p TMessagesProj/src/main/assets/fonts
          PIXEL_URL=$(curl -sA "Android 4.0" "https://googleapis.com" | grep -oE 'https://[^)]+\.ttf' | head -n 1)
          MONO_URL=$(curl -sA "Android 4.0" "https://googleapis.com" | grep -oE 'https://[^)]+\.ttf' | head -n 1)
          DOT_URL=$(curl -sA "Android 4.0" "https://googleapis.com" | grep -oE 'https://[^)]+\.ttf' | head -n 1)
          [ -n "$PIXEL_URL" ] && curl -sL "$PIXEL_URL" -o TMessagesProj/src/main/assets/fonts/sg_pixel.ttf || true
          [ -n "$MONO_URL" ] && curl -sL "$MONO_URL" -o TMessagesProj/src/main/assets/fonts/sg_mono.ttf || true
          [ -n "$DOT_URL" ] && curl -sL "$DOT_URL" -o TMessagesProj/src/main/assets/fonts/sg_dot.ttf || true

          pip install -q Pillow
          python3 - << 'EOF'
          import os, re, glob, colorsys
          from PIL import Image

          def patch_file(path, fn):
              if os.path.exists(path):
                  with open(path, 'r', encoding='utf-8') as f:
                      txt = f.read()
                  new_txt = fn(txt)
                  if new_txt != txt:
                      with open(path, 'w', encoding='utf-8') as f:
                          f.write(new_txt)
                      print("Patched:", path)

          # 1. Бренд, ссылки и канал
          for root, _, files in os.walk("TMessagesProj/src/main/java"):
              for fn in files:
                  if fn.endswith((".java", ".kt")) and fn != "OpenExteraSettingsActivity.java":
                      p = os.path.join(root, fn)
                      patch_file(p, lambda s: s.replace('"exteraless"', '"SpaceGram"')
                                               .replace('"Exteraless"', '"SpaceGram"')
                                               .replace('exteraless/exteraless', 'rowwwex/SpaceGram')
                                               .replace('openByUserName("exteraless"', 'openByUserName("SpaceGram_Client"')
                                               .replace('"@exteraless"', '"@SpaceGram_Client"'))

          # 2. Генерация 22 глубоких тёмных (AMOLED) и чистых светлых тем
          assets_dir = "TMessagesProj/src/main/assets"
          themes_out = os.path.join(assets_dir, "sg_themes")
          os.makedirs(themes_out, exist_ok=True)

          def hex_to_rgb(h):
              h = h.lstrip('#')
              return tuple(int(h[i:i+2], 16) for i in (0, 2, 4))

          def signed_to_argb(val):
              u = val & 0xFFFFFFFF
              return ((u >> 24) & 0xFF, (u >> 16) & 0xFF, (u >> 8) & 0xFF, u & 0xFF)

          def argb_to_signed(a, r, g, b):
              u = ((a & 0xFF) << 24) | ((r & 0xFF) << 16) | ((g & 0xFF) << 8) | (b & 0xFF)
              return u - 0x100000000 if u >= 0x80000000 else u

          def build_theme_pair(out_prefix, base_dark, base_light, accent_hex, dark_bg, dark_card, dark_bub, light_bg, light_bub):
              ar, ag, ab = hex_to_rgb(accent_hex)
              ah, al, asat = colorsys.rgb_to_hls(ar / 255.0, ag / 255.0, ab / 255.0)

              # Dark theme (глубокий чёрный OLED для списка чатов, карточек и чата)
              if os.path.exists(base_dark):
                  bgr, bgg, bgb = hex_to_rgb(dark_bg)
                  cr, cg, cb = hex_to_rgb(dark_card)
                  bur, bug, bub = hex_to_rgb(dark_bub)
                  lines = []
                  with open(base_dark, "r", encoding="utf-8", errors="ignore") as f:
                      for line in f:
                          line = line.strip()
                          if "=" not in line or line.startswith("//"):
                              continue
                          k, v = line.split("=", 1)
                          try:
                              num = int(v.strip())
                          except ValueError:
                              lines.append(f"{k}={v}")
                              continue
                          a, r, g, b = signed_to_argb(num)
                          kl = k.lower()
                          h, l, s = colorsys.rgb_to_hls(r / 255.0, g / 255.0, b / 255.0)
                          if "chat_outbubble" in kl and "gradient" not in kl and "shadow" not in kl and "selected" not in kl:
                              r, g, b = bur, bug, bub
                          elif "chat_inbubble" in kl and "gradient" not in kl and "shadow" not in kl and "selected" not in kl:
                              r, g, b = cr, cg, cb
                          elif "chat_wallpaper" in kl or "windowbackgroundgray" in kl or "chat_messagepanelbackground" in kl:
                              r, g, b = bgr, bgg, bgb
                          elif ("windowbackgroundwhite" in kl or "actionbardefault" in kl) and "text" not in kl and "icon" not in kl and "search" not in kl and l < 0.28:
                              r, g, b = bgr, bgg, bgb
                          elif ("dialogbackground" in kl or "submenubackground" in kl or "pinnedoverlay" in kl) and l < 0.28:
                              r, g, b = cr, cg, cb
                          elif s > 0.20 and 0.12 < l < 0.90:
                              nr, ng, nb = colorsys.hls_to_rgb(ah, min(0.56, max(0.38, l)), min(1.0, max(asat, s)))
                              r, g, b = int(nr * 255), int(ng * 255), int(nb * 255)
                          lines.append(f"{k}={argb_to_signed(a, r, g, b)}")
                  with open(os.path.join(themes_out, f"{out_prefix}_dark.attheme"), "w", encoding="utf-8") as f:
                      f.write("\n".join(lines) + "\n")

              # Light theme (чистый светлый фон и глубокие контрастные акценты)
              if os.path.exists(base_light):
                  lbgr, lbgg, lbgb = hex_to_rgb(light_bg)
                  lbur, lbug, lbub = hex_to_rgb(light_bub)
                  lines = []
                  with open(base_light, "r", encoding="utf-8", errors="ignore") as f:
                      for line in f:
                          line = line.strip()
                          if "=" not in line or line.startswith("//"):
                              continue
                          k, v = line.split("=", 1)
                          try:
                              num = int(v.strip())
                          except ValueError:
                              lines.append(f"{k}={v}")
                              continue
                          a, r, g, b = signed_to_argb(num)
                          kl = k.lower()
                          h, l, s = colorsys.rgb_to_hls(r / 255.0, g / 255.0, b / 255.0)
                          if "chat_outbubble" in kl and "gradient" not in kl and "shadow" not in kl and "selected" not in kl:
                              r, g, b = lbur, lbug, lbub
                          elif "chat_wallpaper" in kl:
                              r, g, b = lbgr, lbgg, lbgb
                          elif s > 0.20 and 0.15 < l < 0.85:
                              nr, ng, nb = colorsys.hls_to_rgb(ah, min(0.46, l), min(1.0, max(asat, s)))
                              r, g, b = int(nr * 255), int(ng * 255), int(nb * 255)
                          lines.append(f"{k}={argb_to_signed(a, r, g, b)}")
                  with open(os.path.join(themes_out, f"{out_prefix}_light.attheme"), "w", encoding="utf-8") as f:
                      f.write("\n".join(lines) + "\n")

          amoled_b = os.path.join(assets_dir, "amoled.attheme")
          day_b = os.path.join(assets_dir, "day.attheme")

          theme_specs = [
              ("sg_cosmic",  amoled_b, day_b, "#0284C7", "#000000", "#080D16", "#0C4A6E", "#F1F5F9", "#DBEAFE"),
              ("sg_glitch",  amoled_b, day_b, "#E11D48", "#000000", "#0E070B", "#881337", "#F8F5F6", "#FFE4E6"),
              ("sg_cyan",    amoled_b, day_b, "#0891B2", "#000000", "#061014", "#155E75", "#F0F7F9", "#CFFAFE"),
              ("sg_emerald", amoled_b, day_b, "#059669", "#000000", "#06110D", "#064E3B", "#F2F7F5", "#D1FAE5"),
              ("sg_pixel",   amoled_b, day_b, "#16A34A", "#000000", "#0A0F0B", "#14532D", "#F3F6F4", "#DCFCE7"),
              ("sg_pixem",   amoled_b, day_b, "#10B981", "#000000", "#06120E", "#065F46", "#F1F7F4", "#D1FAE5"),
              ("sg_sunset",  amoled_b, day_b, "#EA580C", "#000000", "#120906", "#7C2D12", "#F9F5F2", "#FFEDD5"),
              ("sg_bsod",    amoled_b, day_b, "#2563EB", "#00007A", "#000055", "#1E3A8A", "#F1F5FB", "#DBEAFE"),
              ("sg_cyber",   amoled_b, day_b, "#9333EA", "#000000", "#0D0716", "#581C87", "#F6F3FA", "#EDE9FE"),
              ("sg_nothing", amoled_b, day_b, "#DC2626", "#000000", "#0C0C0C", "#1C1C1E", "#F4F4F5", "#E4E4E7"),
              ("sg_light",   amoled_b, day_b, "#3F3F46", "#000000", "#0F0F11", "#27272A", "#F4F4F5", "#E4E4E7"),
          ]

          for spec in theme_specs:
              build_theme_pair(*spec)

          # 3. Мгновенные шрифты без перезапуска (TypefaceHelper + AndroidUtilities) + заголовок SpaceGram
          def patch_typeface(s):
              helper_code = '''
              private static int cachedFontMode = -1;
              private static Typeface customReg;
              private static Typeface customBold;

              public static void resetCustomFont() {
                  cachedFontMode = -1;
                  customReg = null;
                  customBold = null;
                  try {
                      for (java.lang.reflect.Field f : org.telegram.messenger.AndroidUtilities.class.getDeclaredFields()) {
                          if (java.util.Map.class.isAssignableFrom(f.getType())) {
                              f.setAccessible(true);
                              Object m = f.get(null);
                              if (m instanceof java.util.Map) ((java.util.Map<?, ?>) m).clear();
                          }
                      }
                  } catch (Throwable ignored) {}
              }

              public static Typeface getSelectedCustomFont(int weight, boolean italic) {
                  if (ApplicationLoader.applicationContext == null) return null;
                  int mode = ApplicationLoader.applicationContext.getSharedPreferences("spacegram_prefs", 0).getInt("font_style", 0);
                  if (mode == 0) return null;
                  if (mode != cachedFontMode) {
                      cachedFontMode = mode;
                      customReg = null;
                      customBold = null;
                      String asset = mode == 1 ? "fonts/sg_euclid.ttf"
                                   : (mode == 2 ? "fonts/sg_pixel.ttf"
                                   : (mode == 3 ? "fonts/sg_mono.ttf" : "fonts/sg_dot.ttf"));
                      try {
                          File f = new File(ApplicationLoader.getFilesDirFixed(), "sg_font_v2_" + mode + ".ttf");
                          if (!f.exists() || f.length() < 1000) {
                              try (java.io.InputStream is = ApplicationLoader.applicationContext.getAssets().open(asset);
                                   java.io.FileOutputStream fos = new java.io.FileOutputStream(f)) {
                                  int b;
                                  while ((b = is.read()) != -1) fos.write(b);
                              }
                          }
                          if (f.exists() && f.length() > 1000) {
                              customReg = Typeface.createFromFile(f);
                              customBold = Build.VERSION.SDK_INT >= Build.VERSION_CODES.P
                                      ? Typeface.create(customReg, 700, false)
                                      : Typeface.create(customReg, Typeface.BOLD);
                          }
                      } catch (Throwable ignored) {}
                  }
                  Typeface base = weight >= 600 ? customBold : customReg;
                  if (base == null) return null;
                  if (italic) return Typeface.create(base, Typeface.ITALIC);
                  return base;
              }
          '''
              s = s.replace('public static Typeface createTypeface(String assetPath) {',
                            helper_code + '\n    public static Typeface createTypeface(String assetPath) {\n'
                            '        boolean isBold = assetPath != null && (assetPath.contains("medium") || assetPath.contains("bold"));\n'
                            '        boolean isIt = assetPath != null && assetPath.contains("italic");\n'
                            '        Typeface sgTf = getSelectedCustomFont(isBold ? 700 : 400, isIt);\n'
                            '        if (sgTf != null) return sgTf;')
              s = s.replace('public static Typeface createTypeface(int weight, boolean italic) {',
                            'public static Typeface createTypeface(int weight, boolean italic) {\n'
                            '        Typeface sgTf = getSelectedCustomFont(weight, italic);\n'
                            '        if (sgTf != null) return sgTf;')
              s = s.replace('String title = (String) NaConfig.INSTANCE.getCustomTitle().defaultValue;',
                            'String title = "SpaceGram";')
              s = s.replace('if (!TextUtils.isEmpty(customTitle)) {',
                            'if (!TextUtils.isEmpty(customTitle) && !"exteraless".equalsIgnoreCase(customTitle.trim())) {')
              return s

          patch_file("TMessagesProj/src/main/java/tw/nekomimi/nekogram/helpers/TypefaceHelper.java", patch_typeface)

          def patch_android_utils(s):
              target = 'public static Typeface getTypeface(String assetPath) {'
              hook = '''public static Typeface getTypeface(String assetPath) {
                  boolean sgBold = assetPath != null && (assetPath.contains("medium") || assetPath.contains("bold"));
                  boolean sgIt = assetPath != null && assetPath.contains("italic");
                  android.graphics.Typeface sgCustom = tw.nekomimi.nekogram.helpers.TypefaceHelper.getSelectedCustomFont(sgBold ? 700 : 400, sgIt);
                  if (sgCustom != null) return sgCustom;'''
              return s.replace(target, hook, 1)

          patch_file("TMessagesProj/src/main/java/org/telegram/messenger/AndroidUtilities.java", patch_android_utils)

          # 4. Экран "Темы" (полное описание + кнопка снизу справа + переключатель Тёмная/Светлая)
          themes_activity_path = "TMessagesProj/src/main/java/app/exteraless/settings/SpaceGramThemesActivity.java"
          with open(themes_activity_path, "w", encoding="utf-8") as f:
              f.write('''package app.exteraless.settings;

          import static org.telegram.messenger.AndroidUtilities.dp;

          import android.content.Context;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.graphics.Outline;
          import android.util.TypedValue;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.ViewOutlineProvider;
          import android.widget.FrameLayout;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;

          import androidx.annotation.NonNull;
          import androidx.recyclerview.widget.RecyclerView;

          import org.telegram.messenger.AndroidUtilities;
          import org.telegram.messenger.ApplicationLoader;
          import org.telegram.messenger.NotificationCenter;
          import org.telegram.messenger.R;
          import org.telegram.ui.ActionBar.BottomSheet;
          import org.telegram.ui.ActionBar.Theme;
          import org.telegram.ui.Cells.CheckBoxCell;
          import org.telegram.ui.Cells.TextSettingsCell;
          import org.telegram.ui.Components.LayoutHelper;
          import org.telegram.ui.LauncherIconController;

          import java.io.BufferedReader;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.lang.reflect.Method;
          import java.nio.charset.StandardCharsets;
          import java.util.ArrayList;
          import java.util.List;
          import java.util.Locale;
          import java.util.concurrent.atomic.AtomicBoolean;

          import tw.nekomimi.nekogram.helpers.TypefaceHelper;
          import tw.nekomimi.nekogram.settings.BaseNekoSettingsActivity;

          public class SpaceGramThemesActivity extends BaseNekoSettingsActivity {

              private static class ThemePreset {
                  final String id;
                  final String title;
                  final String teaser;
                  final int iconRes;
                  final String iconEnum;
                  final int fontMode;
                  final String fontName;

                  ThemePreset(String id, String title, String teaser, int iconRes, String iconEnum, int fontMode, String fontName) {
                      this.id = id;
                      this.title = title;
                      this.teaser = teaser;
                      this.iconRes = iconRes;
                      this.iconEnum = iconEnum;
                      this.fontMode = fontMode;
                      this.fontName = fontName;
                  }
              }

              private static final ThemePreset[] PRESETS = new ThemePreset[]{
                  new ThemePreset("sg_cosmic", "SpaceGram", "Глубокий космос и холодное орбитальное свечение", R.drawable.exteraless_icon_background, "EXTERALESS", 1, "Euclid Circular B"),
                  new ThemePreset("sg_glitch", "Glitch", "Цифровой сбой на грани темноты и хроматики", R.drawable.blueprint_icon_background, "BLUEPRINT", 4, "Press Start 2P"),
                  new ThemePreset("sg_cyan", "Cyan Orbit", "Чистый импульс ледяного неона в вакууме", R.drawable.red_icon_background, "RED", 1, "Euclid Circular B"),
                  new ThemePreset("sg_emerald", "Emerald", "Тёмная глубина изумруда с мягким свечением", R.drawable.nya_icon_background, "NYA", 1, "Euclid Circular B"),
                  new ThemePreset("sg_pixel", "Pixel Classic", "Ламповая классика в духе воксельных миров", R.drawable.ayu_icon_background, "AYU", 2, "Pixelify Sans"),
                  new ThemePreset("sg_pixem", "Pixel Emerald", "Редкая руда и строгая 8-битная геометрия", R.drawable.quack_icon_background, "QUACK", 2, "Pixelify Sans"),
                  new ThemePreset("sg_sunset", "Sunset", "Тёплый горизонт заката и вечерний градиент", R.drawable.go_icon_background, "GO", 1, "Euclid Circular B"),
                  new ThemePreset("sg_bsod", "BSOD", "Критическая эстетика синего экрана 0x0000007B", R.drawable.hand_icon_background, "HAND", 3, "JetBrains Mono"),
                  new ThemePreset("sg_cyber", "Cyber", "Ночной мегаполис, фиолет и электрический разряд", R.drawable.mono_icon_background, "MONO", 3, "JetBrains Mono"),
                  new ThemePreset("sg_nothing", "Nothing", "Чистый монохром, матрица и ничего лишнего", R.drawable.nothing_icon_background, "NOTHING", 4, "Press Start 2P"),
                  new ThemePreset("sg_light", "Light", "Светлый минимализм с контрастным характером", R.drawable.plus_icon_background, "PLUS", 1, "Euclid Circular B")
              };

              private int[] presetRows = new int[PRESETS.length];
              private int bottomDividerRow;

              @Override
              protected void updateRows() {
                  super.updateRows();
                  for (int i = 0; i < PRESETS.length; i++) {
                      presetRows[i] = addRow("preset_" + i);
                  }
                  bottomDividerRow = addRow();
              }

              @Override
              protected String getActionBarTitle() {
                  return "Темы";
              }

              @Override
              protected String getKey() {
                  return "spacegram_themes";
              }

              @Override
              protected BaseListAdapter createAdapter(Context context) {
                  return new ListAdapter(context);
              }

              @Override
              protected void onItemClick(View view, int position, float x, float y) {
              }

              private void showApplySheet(ThemePreset preset) {
                  Context ctx = getParentActivity();
                  if (ctx == null) return;

                  BottomSheet.Builder builder = new BottomSheet.Builder(ctx);
                  builder.setTitle("Применить «" + preset.title + "»", true);

                  LinearLayout container = new LinearLayout(ctx);
                  container.setOrientation(LinearLayout.VERTICAL);
                  container.setPadding(0, dp(4), 0, dp(12));

                  final AtomicBoolean useDark = new AtomicBoolean(Theme.isCurrentThemeNight());

                  TextSettingsCell modeCell = new TextSettingsCell(ctx);
                  modeCell.setTextAndValue("Версия палитры", useDark.get() ? "Тёмная" : "Светлая", true);
                  modeCell.setOnClickListener(v -> {
                      useDark.set(!useDark.get());
                      modeCell.setTextAndValue("Версия палитры", useDark.get() ? "Тёмная" : "Светлая", true);
                  });
                  container.addView(modeCell, LayoutHelper.createLinear(LayoutHelper.MATCH_PARENT, 50));

                  CheckBoxCell cbColors = new CheckBoxCell(ctx, 1);
                  cbColors.setText("Цвета интерфейса", "Весь клиент и чаты", true, true);
                  cbColors.setOnClickListener(v -> cbColors.setChecked(!cbColors.isChecked(), true));
                  container.addView(cbColors, LayoutHelper.createLinear(LayoutHelper.MATCH_PARENT, 50));

                  CheckBoxCell cbWallpaper = new CheckBoxCell(ctx, 1);
                  cbWallpaper.setText("Фон и обои чата", "В тон темы", true, true);
                  cbWallpaper.setOnClickListener(v -> cbWallpaper.setChecked(!cbWallpaper.isChecked(), true));
                  container.addView(cbWallpaper, LayoutHelper.createLinear(LayoutHelper.MATCH_PARENT, 50));

                  CheckBoxCell cbFont = new CheckBoxCell(ctx, 1);
                  cbFont.setText("Шрифт темы", preset.fontName, true, true);
                  cbFont.setOnClickListener(v -> cbFont.setChecked(!cbFont.isChecked(), true));
                  container.addView(cbFont, LayoutHelper.createLinear(LayoutHelper.MATCH_PARENT, 50));

                  CheckBoxCell cbIcon = new CheckBoxCell(ctx, 1);
                  cbIcon.setText("Иконка приложения", preset.title, true, false);
                  cbIcon.setOnClickListener(v -> cbIcon.setChecked(!cbIcon.isChecked(), true));
                  container.addView(cbIcon, LayoutHelper.createLinear(LayoutHelper.MATCH_PARENT, 50));

                  TextView applyBtn = new TextView(ctx);
                  applyBtn.setText("Применить");
                  applyBtn.setTextColor(Color.WHITE);
                  applyBtn.setTextSize(TypedValue.COMPLEX_UNIT_DIP, 15);
                  applyBtn.setTypeface(AndroidUtilities.bold());
                  applyBtn.setGravity(Gravity.CENTER);
                  applyBtn.setBackground(Theme.createSimpleSelectorRoundRectDrawable(
                          dp(12),
                          Theme.getColor(Theme.key_featuredStickers_addButton),
                          Theme.getColor(Theme.key_featuredStickers_addButtonPressed)
                  ));
                  container.addView(applyBtn, LayoutHelper.createLinear(LayoutHelper.MATCH_PARENT, 48, 16, 14, 16, 4));

                  builder.setCustomView(container);
                  BottomSheet sheet = builder.create();

                  applyBtn.setOnClickListener(v -> {
                      sheet.dismiss();
                      executeApply(preset, useDark.get(), cbColors.isChecked(), cbWallpaper.isChecked(), cbFont.isChecked(), cbIcon.isChecked());
                  });

                  sheet.show();
              }

              private static void applyThemeAsset(String presetId, String title, boolean darkMode, boolean applyColors, boolean applyWallpaper) {
                  String suffix = darkMode ? "_dark.attheme" : "_light.attheme";
                  try {
                      File outFile = new File(ApplicationLoader.getFilesDirFixed(), presetId + suffix);
                      List<String> filtered = new ArrayList<>();
                      try (InputStream is = ApplicationLoader.applicationContext.getAssets().open("sg_themes/" + presetId + suffix);
                           BufferedReader br = new BufferedReader(new InputStreamReader(is, StandardCharsets.UTF_8))) {
                          String line;
                          while ((line = br.readLine()) != null) {
                              boolean isWall = line.toLowerCase(Locale.US).startsWith("chat_wallpaper");
                              if (applyColors && applyWallpaper) {
                                  filtered.add(line);
                              } else if (applyColors && !isWall) {
                                  filtered.add(line);
                              } else if (applyWallpaper && isWall) {
                                  filtered.add(line);
                              }
                          }
                      }
                      try (FileOutputStream fos = new FileOutputStream(outFile)) {
                          for (String l : filtered) {
                              fos.write(l.getBytes(StandardCharsets.UTF_8));
                              fos.write(10);
                          }
                      }
                      for (Method m : Theme.class.getDeclaredMethods()) {
                          if ("applyThemeFile".equals(m.getName()) && m.getParameterCount() == 4) {
                              m.setAccessible(true);
                              m.invoke(null, outFile, title + (darkMode ? " Dark" : " Light"), null, false);
                              break;
                          }
                      }
                  } catch (Throwable ignored) {}
              }

              private void executeApply(ThemePreset preset, boolean darkMode, boolean applyColors, boolean applyWallpaper, boolean applyFont, boolean applyIcon) {
                  SharedPreferences prefs = ApplicationLoader.applicationContext.getSharedPreferences("spacegram_prefs", 0);

                  if (applyColors || applyWallpaper) {
                      prefs.edit()
                           .putString("active_theme_id", preset.id)
                           .putString("active_theme_title", preset.title)
                           .putBoolean("active_apply_colors", applyColors)
                           .putBoolean("active_apply_wallpaper", applyWallpaper)
                           .apply();
                      applyThemeAsset(preset.id, preset.title, darkMode, applyColors, applyWallpaper);
                  }

                  if (applyFont) {
                      prefs.edit().putInt("font_style", preset.fontMode).apply();
                      TypefaceHelper.resetCustomFont();
                      try {
                          Theme.createCommonResources(ApplicationLoader.applicationContext);
                      } catch (Throwable ignored) {}
                      NotificationCenter.getGlobalInstance().postNotificationName(NotificationCenter.didSetNewTheme);
                  }

                  if (applyIcon) {
                      try {
                          LauncherIconController.LauncherIcon target = LauncherIconController.LauncherIcon.valueOf(preset.iconEnum);
                          LauncherIconController.setIcon(target);
                      } catch (Throwable ignored) {}
                  }

                  Toast.makeText(getParentActivity(), "Тема «" + preset.title + "» применена", Toast.LENGTH_SHORT).show();
              }

