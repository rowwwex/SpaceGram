name: Release Build

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish release for in-app updater'
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Gradle Build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      build_timestamp: ${{ steps.release_build_step.outputs.build_timestamp }}
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_HARDLINK: "true"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "2G"
      NATIVE_TARGET: "arm64-v8a"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: recursive
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Set up Python for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Point Chaquopy at that Python
        run: echo "CHAQUOPY_BUILD_PYTHON=$(which python3.11 || which python)" >> $GITHUB_ENV
      - name: Cache Permanent APK Signing Key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: spacegram-signing-key-v1
      - name: Set up Ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: android-ndk
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Set up Android SDK Tools
        uses: android-actions/setup-android@v4
        with:
          packages: "build-tools;36.0.0 ndk;27.2.12479018 platforms;android-37.0"
      - name: Install Native Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes nasm
          python3 -m pip install --quiet pillow
      - name: Apply SpaceGram v0.3 Patch
        env:
          SECRET_APP_ID: ${{ secrets.APP_ID }}
          SECRET_APP_HASH: ${{ secrets.APP_HASH }}
        run: |
          app_id="${SECRET_APP_ID:-6}"
          app_hash="${SECRET_APP_HASH:-eb06d4abfb49dc3eeb1aeb98ae0f581e}"
          printf "sdk.dir=%s\nTELEGRAM_APP_ID=%s\nTELEGRAM_APP_HASH=%s\n" "$ANDROID_HOME" "$app_id" "$app_hash" > local.properties

          find . -maxdepth 4 \( -name "build.gradle*" -o -name "*.kt" -o -name "*.properties" -o -name "google-services.json" \) -exec sed -i 's|com\.exteraless\.app|com.spacegram.messenger|g' {} +
          find TMessagesProj/src/main/res* -name "strings*.xml" -exec sed -i -E 's|>([^<]*)[Ee]xteraless([^<]*)<|>\1SpaceGram\2<|g; s|>([^<]*)[Ee]xteraless([^<]*)<|>\1SpaceGram\2<|g; s|@SpaceGram([^_])|@SpaceGram_Client\1|g; s|@SpaceGram<|@SpaceGram_Client<|g' {} +

          python3 - << 'EOF'
          import os, re, glob
          from PIL import Image

          def patch_file(path, fn):
              if os.path.exists(path):
                  with open(path, 'r', encoding='utf-8') as f:
                      txt = f.read()
                  new_txt = fn(txt)
                  if new_txt != txt:
                      with open(path, 'w', encoding='utf-8') as f:
                          f.write(new_txt)
                      print("Patched:", path)

          # 1. Заголовок чатов, превью в Оформлении и GitHub в настройках
          for root, _, files in os.walk("TMessagesProj/src/main/java"):
              for fn in files:
                  if fn.endswith((".java", ".kt")) and fn != "OpenExteraSettingsActivity.java":
                      p = os.path.join(root, fn)
                      patch_file(p, lambda s: s.replace('"exteraless"', '"SpaceGram"')
                                               .replace('exteraless/exteraless', 'rowwwex/SpaceGram')
                                               .replace('openByUserName("exteraless"', 'openByUserName("SpaceGram_Client"')
                                               .replace('"@exteraless"', '"@SpaceGram_Client"'))

          # 2. Создаём отдельный экран "О форке" (ForkInfoActivity.java)
          fork_activity_path = "TMessagesProj/src/main/java/app/exteraless/settings/ForkInfoActivity.java"
          with open(fork_activity_path, "w", encoding="utf-8") as f:
              f.write('''package app.exteraless.settings;

          import android.content.Context;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.FrameLayout;
          import androidx.annotation.NonNull;
          import androidx.recyclerview.widget.LinearLayoutManager;
          import androidx.recyclerview.widget.RecyclerView;
          import org.telegram.messenger.R;
          import org.telegram.messenger.browser.Browser;
          import org.telegram.ui.ActionBar.ActionBar;
          import org.telegram.ui.ActionBar.BaseFragment;
          import org.telegram.ui.ActionBar.Theme;
          import org.telegram.ui.Cells.HeaderCell;
          import org.telegram.ui.Cells.ShadowSectionCell;
          import org.telegram.ui.Cells.TextSettingsCell;
          import org.telegram.ui.Components.LayoutHelper;
          import org.telegram.ui.Components.RecyclerListView;

          public class ForkInfoActivity extends BaseFragment {
              @Override
              public View createView(Context context) {
                  actionBar.setBackButtonImage(R.drawable.ic_ab_back);
                  actionBar.setAllowOverlayTitle(true);
                  actionBar.setTitle("О форке");
                  actionBar.setActionBarMenuOnItemClick(new ActionBar.ActionBarMenuOnItemClick() {
                      @Override
                      public void onItemClick(int id) {
                          if (id == -1) finishFragment();
                      }
                  });

                  fragmentView = new FrameLayout(context);
                  FrameLayout frameLayout = (FrameLayout) fragmentView;
                  frameLayout.setBackgroundColor(Theme.getColor(Theme.key_windowBackgroundGray));

                  RecyclerListView listView = new RecyclerListView(context);
                  listView.setLayoutManager(new LinearLayoutManager(context, LinearLayoutManager.VERTICAL, false));
                  listView.setVerticalScrollBarEnabled(false);
                  listView.setAdapter(new ListAdapter(context));
                  frameLayout.addView(listView, LayoutHelper.createFrame(LayoutHelper.MATCH_PARENT, LayoutHelper.MATCH_PARENT));

                  listView.setOnItemClickListener((view, position) -> {
                      if (position == 1) {
                          Browser.openUrl(getParentActivity(), "https://github.com");
                      } else if (position == 4) {
                          Browser.openUrl(getParentActivity(), "https://google.com");
                      } else if (position == 5) {
                          Browser.openUrl(getParentActivity(), "https://claude.ai");
                      } else if (position == 6) {
                          Browser.openUrl(getParentActivity(), "https://chatgpt.com");
                      }
                  });

                  return fragmentView;
              }

              private static class ListAdapter extends RecyclerListView.SelectionAdapter {
                  private final Context mContext;
                  ListAdapter(Context context) { mContext = context; }

                  @Override
                  public int getItemCount() { return 8; }

                  @Override
                  public boolean isEnabled(RecyclerView.ViewHolder holder) {
                      int pos = holder.getAdapterPosition();
                      return pos == 1 || pos == 4 || pos == 5 || pos == 6;
                  }

                  @NonNull
                  @Override
                  public RecyclerView.ViewHolder onCreateViewHolder(@NonNull ViewGroup parent, int viewType) {
                      View view;
                      if (viewType == 0) {
                          view = new HeaderCell(mContext);
                          view.setBackgroundColor(Theme.getColor(Theme.key_windowBackgroundWhite));
                      } else if (viewType == 1) {
                          view = new TextSettingsCell(mContext);
                          view.setBackgroundColor(Theme.getColor(Theme.key_windowBackgroundWhite));
                      } else {
                          view = new ShadowSectionCell(mContext);
                      }
                      return new RecyclerListView.Holder(view);
                  }

                  @Override
                  public void onBindViewHolder(@NonNull RecyclerView.ViewHolder holder, int position) {
                      if (holder.getItemViewType() == 0) {
                          HeaderCell cell = (HeaderCell) holder.itemView;
                          if (position == 0) cell.setText("Основа клиента");
                          else if (position == 3) cell.setText("Благодарности");
                      } else if (holder.getItemViewType() == 1) {
                          TextSettingsCell cell = (TextSettingsCell) holder.itemView;
                          if (position == 1) cell.setTextAndValue("exteraless", "GitHub", false);
                          else if (position == 4) cell.setTextAndValue("Gemini", "Google AI", true);
                          else if (position == 5) cell.setTextAndValue("Claude", "Anthropic", true);
                          else if (position == 6) cell.setTextAndValue("ChatGPT", "OpenAI", false);
                      }
                  }

                  @Override
                  public int getItemViewType(int position) {
                      if (position == 0 || position == 3) return 0;
                      if (position == 2 || position == 7) return 2;
                      return 1;
                  }
              }
          }
          ''')

          # 3. Точечно обновляем OpenExteraSettingsActivity.java по известным строкам
          def patch_settings(s):
              s = s.replace('getMessagesController().openByUserName("exteraless", this, 1);',
                            'getMessagesController().openByUserName("SpaceGram_Client", this, 1);')
              s = s.replace('"@exteraless"', '"@SpaceGram_Client"')
              s = s.replace('"https://github.com"',
                            '"https://github.com"')
              # Убираем вторую дизайнерскую строку (designStudioRow) и превращаем первую в кнопку "О форке"
              s = s.replace('designStudioRow = addRow("designStudio");', '')
              s = s.replace('getMessagesController().openByUserName("the8055u", this, 1);',
                            'presentFragment(new ForkInfoActivity());')
              s = s.replace('cell.setText(getString(R.string.OpenExteraDesignSection));',
                            'cell.setText("О моде");')
              s = s.replace('cell.setTextAndValueAndIcon(getString(R.string.OpenExteraDesigner),\n                                "@the8055u", R.drawable.msg_theme, true);',
                            'cell.setTextAndIcon("О форке", R.drawable.msg_info, false);')
              s = s.replace('cell.setTextAndValueAndIcon(getString(R.string.OpenExteraDesigner),\n                        "@the8055u", R.drawable.msg_theme, true);',
                            'cell.setTextAndIcon("О форке", R.drawable.msg_info, false);')
              return s

          patch_file("TMessagesProj/src/main/java/app/exteraless/settings/OpenExteraSettingsActivity.java", patch_settings)

          # 4. Иконки без двойного контура + точные подписи + сетка 4x4 (16 штук)
          res_dir = "TMessagesProj/src/main/res"
          xxx_dir = os.path.join(res_dir, "drawable-xxxhdpi")

          spaced = os.path.join(xxx_dir, "ic_spacegram_ 1.png")
          fixed1 = os.path.join(xxx_dir, "ic_spacegram_1.png")
          if os.path.exists(spaced) and not os.path.exists(fixed1):
              os.rename(spaced, fixed1)

          slots = [
              ("exteraless", "SpaceGram"),
              ("blueprint", "Glitch"),
              ("red", "Cyan Orbit"),
              ("nya", "Emerald"),
              ("ayu", "Pixel Classic"),
              ("quack", "Pixel Emerald"),
              ("go", "Sunset"),
              ("hand", "BSOD"),
              ("mono", "Cyber"),
              ("nothing", "Nothing"),
              ("plus", "Light")
          ]

          empty_fg = Image.new("RGBA", (512, 512), (0, 0, 0, 0))

          for idx, (slot, label) in enumerate(slots, start=1):
              src_png = os.path.join(xxx_dir, f"ic_spacegram_{idx}.png")
              if os.path.exists(src_png):
                  raw = Image.open(src_png).convert("RGBA").resize((512, 512), Image.LANCZOS)
                  for old in glob.glob(os.path.join(res_dir, "drawable*", f"{slot}_icon_background*")) + glob.glob(os.path.join(res_dir, "drawable*", f"{slot}_icon_foreground*")):
                      os.remove(old)
                  if slot == "exteraless":
                      for old_logo in glob.glob(os.path.join(res_dir, "drawable*", "exteraless_icon.*")):
                          os.remove(old_logo)
                      raw.save(os.path.join(xxx_dir, "exteraless_icon.png"), "PNG")

                  edge_color = raw.getpixel((4, 4))
                  bg = Image.new("RGBA", (512, 512), edge_color)
                  inner = raw.resize((384, 384), Image.LANCZOS)
                  bg.paste(inner, (64, 64), inner)
                  bg.save(os.path.join(xxx_dir, f"{slot}_icon_background.png"), "PNG")
                  empty_fg.save(os.path.join(xxx_dir, f"{slot}_icon_foreground.png"), "PNG")

          for old_raw in glob.glob(os.path.join(xxx_dir, "ic_spacegram_*.png")):
              os.remove(old_raw)

          str_files = [
              "TMessagesProj/src/main/res/values/strings_oe.xml",
              "TMessagesProj/src/main/res/values-ru-rRU/strings_oe.xml"
          ]
          icon_keys = [
              ("AppIconExteraless", "SpaceGram"),
              ("AppIconBlueprint", "Glitch"),
              ("AppIconRed", "Cyan Orbit"),
              ("AppIconNya", "Emerald"),
              ("AppIconAyu", "Pixel Classic"),
              ("AppIconQuack", "Pixel Emerald"),
              ("AppIconGo", "Sunset"),
              ("AppIconHand", "BSOD"),
              ("AppIconMono", "Cyber"),
              ("AppIconNothing", "Nothing"),
              ("AppIconPlus", "Light")
          ]
          for sf in str_files:
              def upd_str(s):
                  for k, v in icon_keys:
                      s = re.sub(rf'(<string name="{k}"[^>]*>)[^<]*(</string>)', rf'\g<1>{v}\g<2>', s)
                  return s
              patch_file(sf, upd_str)

          patch_file("TMessagesProj/src/main/java/app/exteraless/appicons/AppIcons.java",
                     lambda s: s.replace("LauncherIcon.values()", "java.util.Arrays.copyOfRange(LauncherIcon.values(), 0, LauncherIcon.values().length - 1)"))
          patch_file("TMessagesProj/src/main/java/app/exteraless/appicons/AppIconsActivity.java",
                     lambda s: re.sub(r'spanCount\s*=\s*\d+', 'spanCount = 4', s))
          EOF

      - name: Modify Gradle JVM Args
        run: |
          MEMORY_KB=$(awk '/MemTotal/ {print $2}' /proc/meminfo)
          MEMORY_GB=$((MEMORY_KB / 1024 / 1024))
          if [ $MEMORY_GB -ge 12 ]; then
            sed -i '/^org\.gradle\.jvmargs=/d' gradle.properties
            echo "org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=2G -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8" >> gradle.properties
          fi
      - name: Restore signing key
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
        run: |
          if [ -n "$RELEASE_KEYSTORE" ]; then
            echo "$RELEASE_KEYSTORE" | base64 -d > TMessagesProj/release.keystore
          fi
      - name: Release Build
        id: release_build_step
        env:
          COMMIT_ID: ${{ github.event.head_commit.id || github.sha }}
        run: |
          export BUILD_TIMESTAMP=$(date +%s)
          echo "build_timestamp=$BUILD_TIMESTAMP" >> "$GITHUB_OUTPUT"
          ./gradlew TMessagesProj:assembleRelease -x uploadCrashlyticsMappingFileRelease
      - name: Upload arm64-v8a Artifact
        uses: actions/upload-artifact@v7
        with:
          name: SpaceGram-v0.3
          path: |
            TMessagesProj/build/outputs/apk/release/*.apk
      - name: Publish GitHub Release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT=$(echo "$GITHUB_SHA" | cut -c1-7)
          TAG="build-$SHORT"
          APK_FILE=$(ls TMessagesProj/build/outputs/apk/release/*.apk | head -n 1)
          cp "$APK_FILE" "SpaceGram-arm64-$SHORT.apk"
          gh release create "$TAG" "SpaceGram-arm64-$SHORT.apk" \
            --target "$GITHUB_SHA" --latest \
            --title "SpaceGram ($SHORT)" --notes "SpaceGram v0.3 update $SHORT"
