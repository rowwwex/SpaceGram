name: Inspect Themes & Fonts

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Themes & Fonts
        run: |
          echo "=== ASSETS ==="
          find TMessagesProj/src/main/assets -maxdepth 3 || true
          echo "=== TYPEFACE HELPER ==="
          cat TMessagesProj/src/main/java/tw/nekomimi/nekogram/helpers/TypefaceHelper.java
          echo "=== BUILTIN THEMES IN Theme.java ==="
          grep -rn -C 15 "attheme" TMessagesProj/src/main/java/org/telegram/ui/ActionBar/Theme.java | head -n 60 || true
