name: Inspect Settings & Header

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read OpenExteraSettingsActivity & Header
        run: |
          echo "=== OpenExteraSettingsActivity.java ==="
          cat TMessagesProj/src/main/java/app/exteraless/settings/OpenExteraSettingsActivity.java
          echo "=== GITHUB LINKS ==="
          grep -rn "://github.com" TMessagesProj/src/main/java/ || true
          echo "=== CHAT LIST TITLE & PREVIEW ==="
          grep -rn "titleText" TMessagesProj/src/main/java/app/exteraless/ TMessagesProj/src/main/java/org/telegram/ui/DialogsActivity.java || true
