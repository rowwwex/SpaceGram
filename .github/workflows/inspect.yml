name: Inspect Updater & Header

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read Updater, Header & AboutCell
        run: |
          echo "=== AboutHeaderCell.java ==="
          cat TMessagesProj/src/main/java/app/exteraless/settings/AboutHeaderCell.java
          echo "=== GitHubUpdater.java ==="
          cat TMessagesProj/src/main/java/app/exteraless/updater/GitHubUpdater.java
          echo "=== ChatListPreviewCell.java ==="
          cat TMessagesProj/src/main/java/app/exteraless/appearance/ChatListPreviewCell.java
          echo "=== DialogsActivity titleText ==="
          grep -rn -C 15 "titleText" TMessagesProj/src/main/java/org/telegram/ui/DialogsActivity.java || true
